<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Découvrez ce produit sélectionné avec soin par L’Univers du Croyant.">
<title>Produit — L’Univers du Croyant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink: #1C2B24; --sand: #F7F3EC; --copper: #8B6F4E; --sage: #3E5C4E; --white: #FFFFFF; --sand-dark: #EDE6D8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--sand); color: var(--ink); font-family: 'Inter', sans-serif; line-height: 1.5; }
  h1, h2, .serif { font-family: 'Fraunces', serif; font-weight: 500; letter-spacing: -0.01em; }
  a { text-decoration: none; color: inherit; }
  header { display: flex; align-items: center; gap: 14px; padding: 18px 24px; border-bottom: 1px solid var(--sand-dark); position: sticky; top: 0; background: var(--sand); z-index: 10; }
  .back-btn { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
  .breadcrumb { font-size: 0.82rem; color: #6B7871; }
  .breadcrumb span { color: var(--ink); }
  .prod-hero-img { height: 320px; background: linear-gradient(160deg, #DCE3DA, #B9CBBC); display: flex; align-items: center; justify-content: center; font-size: 4rem; position: relative; }
  .badge { position: absolute; top: 16px; left: 16px; background: var(--white); padding: 5px 12px; border-radius: 20px; font-size: 0.72rem; font-weight: 500; color: var(--sage); }
  .prod-body { padding: 24px; }
  .prod-title { font-size: 1.5rem; margin-bottom: 6px; }
  .prod-sub { color: #6B7871; font-size: 0.88rem; margin-bottom: 16px; }
  .prod-price-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 24px; }
  .price { font-size: 1.7rem; font-weight: 600; color: var(--copper); font-family: 'Fraunces', serif; }
  .price-unit { font-size: 0.82rem; color: #8A9189; }
  .variant-group { margin-bottom: 24px; }
  .group-label { font-size: 0.85rem; font-weight: 500; margin-bottom: 10px; }
  .variant-options { display: flex; gap: 8px; flex-wrap: wrap; }
  .variant-pill { padding: 9px 16px; border: 1px solid var(--sand-dark); border-radius: 20px; font-size: 0.85rem; background: var(--white); cursor: pointer; font-family: 'Inter', sans-serif; }
  .variant-pill.active { background: var(--sage); color: var(--white); border-color: var(--sage); }
  .qty-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .qty-selector { display: flex; align-items: center; border: 1px solid var(--sand-dark); border-radius: 4px; }
  .qty-btn { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: var(--sage); background: none; border: none; font-family: 'Inter', sans-serif; cursor: pointer; }
  .qty-val { width: 36px; text-align: center; font-size: 0.95rem; }
  .btn-add { width: 100%; background: var(--sage); color: var(--white); border: none; padding: 16px; border-radius: 4px; font-size: 0.95rem; font-weight: 500; font-family: 'Inter', sans-serif; margin-bottom: 28px; cursor: pointer; }
  .desc-block { margin-bottom: 24px; }
  .desc-title { font-size: 1rem; margin-bottom: 10px; }
  .desc-text { font-size: 0.9rem; color: #4A5750; }
  .info-list { border-top: 1px solid var(--sand-dark); padding-top: 18px; }
  .info-row { display: flex; justify-content: space-between; padding: 10px 0; font-size: 0.85rem; border-bottom: 1px solid var(--sand-dark); }
  .info-row span:first-child { color: #6B7871; }
  .trust-strip { display: flex; gap: 16px; padding: 20px 24px; background: var(--white); border-top: 1px solid var(--sand-dark); font-size: 0.78rem; color: var(--sage); justify-content: space-around; text-align: center; }
  .not-found { padding: 60px 24px; text-align: center; }
</style>
<link rel="stylesheet" href="/premium.css">
<link rel="canonical" href="https://luniversducroyant.fr/produit.html">
<meta property="og:site_name" content="L’Univers du Croyant">
<meta property="og:locale" content="fr_FR">
<meta property="og:type" content="website">
<meta property="og:title" content="Produit — L’Univers du Croyant">
<meta property="og:description" content="Découvrez ce produit sélectionné avec soin par L’Univers du Croyant.">
<meta property="og:url" content="https://luniversducroyant.fr/produit.html">
<meta property="og:image" content="https://luniversducroyant.fr/assets/home-lantern.png">
<meta property="og:image:width" content="1942">
<meta property="og:image:height" content="809">
<meta property="og:image:alt" content="Lanterne en laiton éclairée dans une ambiance chaleureuse">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <header>
    <a href="/" class="back-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 18l-6-6 6-6"/></svg></a>
    <div class="breadcrumb" id="breadcrumb">Chargement…</div>
  </header>

  <div id="productRoot"></div>

  <script src="/catalog.js"></script>
  <script>
    const STORAGE_KEY = 'maison_du_musulman_cart';

    const params = new URLSearchParams(window.location.search);
    const requestedId = params.get('id');
    const product = window.PRODUCTS.find(p => p.id === requestedId) || window.PRODUCTS[0];

    let qty = 1;
    let selected = product.variants.find(v => v.variant === product.defaultVariant) || product.variants[0];

    document.title = product.name + ' — L’Univers du Croyant';
    document.querySelector('meta[name="description"]').content = product.description;
    const canonicalUrl = 'https://luniversducroyant.fr/produit.html?id=' + encodeURIComponent(product.id);
    document.querySelector('link[rel="canonical"]').href = canonicalUrl;
    [['og:title', document.title], ['og:description', product.description], ['og:url', canonicalUrl]].forEach(([name, value]) => {
      const tag = document.querySelector('meta[property="' + name + '"]');
      if (tag) tag.setAttribute('content', value);
    });
    document.getElementById('breadcrumb').innerHTML = product.categoryLabel + ' / <span>' + product.name + '</span>';

    function renderVariantPills() {
      if (!product.variantLabel || product.variants.length <= 1) return '';
      const pills = product.variants.map(v =>
        `<button class="variant-pill${v.variant === selected.variant ? ' active' : ''}" data-variant="${v.variant}">${v.label.replace(/^flacon |^bouteille /,'')}</button>`
      ).join('');
      return `<div class="variant-group">
        <div class="group-label">${product.variantLabel}</div>
        <div class="variant-options" id="variantOptions">${pills}</div>
      </div>`;
    }

    function renderInfoRows() {
      return Object.entries(product.info).map(([k, v]) =>
        `<div class="info-row"><span>${k}</span><span>${v}</span></div>`
      ).join('');
    }

    document.getElementById('productRoot').innerHTML = `
      <div class="prod-hero-img">${product.icon}<div class="badge">${product.badge}</div></div>
      <div class="prod-body">
        <h1 class="prod-title">${product.name}</h1>
        <p class="prod-sub">${product.tagline}</p>
        <div class="prod-price-row">
          <span class="price" id="displayPrice"></span>
          <span class="price-unit" id="displayUnit"></span>
        </div>
        ${renderVariantPills()}
        <div class="qty-row">
          <span class="group-label" style="margin-bottom:0;">Quantité</span>
          <div class="qty-selector">
            <button class="qty-btn" id="qtyMinus">−</button>
            <span class="qty-val" id="qtyVal">1</span>
            <button class="qty-btn" id="qtyPlus">+</button>
          </div>
        </div>
        <button class="btn-add" id="addBtn"></button>
        <div class="desc-block">
          <h3 class="desc-title">Description</h3>
          <p class="desc-text">${product.description}</p>
        </div>
        <div class="info-list">${renderInfoRows()}</div>
      </div>
      <div class="trust-strip">
        <div>🚚<br>Livraison rapide</div>
        <div>🔒<br>Paiement sécurisé</div>
        <div>↩️<br>Retours 14 jours</div>
      </div>
    `;

    function fmt(n) { return n.toFixed(2).replace('.', ',') + ' €'; }

    function updateDisplay() {
      document.getElementById('displayPrice').textContent = fmt(selected.price);
      document.getElementById('displayUnit').textContent = selected.label;
      document.getElementById('qtyVal').textContent = qty;
      document.getElementById('addBtn').textContent = 'Ajouter au panier — ' + fmt(selected.price * qty);
    }

    document.querySelectorAll('.variant-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.variant-pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selected = product.variants.find(v => v.variant === btn.dataset.variant);
        updateDisplay();
      });
    });

    document.getElementById('qtyPlus').addEventListener('click', () => { if (qty < 10) qty++; updateDisplay(); });
    document.getElementById('qtyMinus').addEventListener('click', () => { if (qty > 1) qty--; updateDisplay(); });

    document.getElementById('addBtn').addEventListener('click', () => {
      let cart = [];
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) { try { const parsed = JSON.parse(raw); if (Array.isArray(parsed)) cart = parsed.filter(item => item && typeof item === 'object'); } catch(e) {} }

      const existing = cart.find(item => item.id === product.id && item.variant === selected.label);
      if (existing) {
        existing.qty = Math.min(10, (Number(existing.qty) || 0) + qty);
      } else {
        cart.push({ id: product.id, name: product.name, variant: selected.label, price: selected.price, qty: qty, icon: product.icon });
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cart));
      window.location.href = '/panier.html';
    });

    updateDisplay();
  </script>
</body>
</html>
