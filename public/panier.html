<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panier — La Maison du Musulman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink: #1C2B24; --sand: #F7F3EC; --copper: #8B6F4E; --sage: #3E5C4E; --white: #FFFFFF; --sand-dark: #EDE6D8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--sand); color: var(--ink); font-family: 'Inter', sans-serif; line-height: 1.5; padding-bottom: 120px; }
  h1, h2, .serif { font-family: 'Fraunces', serif; font-weight: 500; letter-spacing: -0.01em; }
  header { display: flex; align-items: center; gap: 14px; padding: 18px 24px; border-bottom: 1px solid var(--sand-dark); position: sticky; top: 0; background: var(--sand); z-index: 10; }
  .back-btn { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
  .page-title { font-size: 1.15rem; }
  .empty-state { padding: 80px 24px; text-align: center; display: none; }
  .empty-state.show { display: block; }
  .empty-icon { font-size: 2.5rem; margin-bottom: 16px; }
  .empty-text { color: #6B7871; font-size: 0.9rem; margin-bottom: 24px; }
  .btn-shop { display: inline-block; background: var(--sage); color: var(--white); padding: 13px 28px; border-radius: 4px; font-size: 0.9rem; text-decoration: none; }
  .cart-list { padding: 16px 24px; }
  .cart-item { display: flex; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--sand-dark); }
  .item-img { width: 68px; height: 68px; border-radius: 4px; background: #DCE3DA; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; flex-shrink: 0; }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-size: 0.92rem; font-weight: 500; margin-bottom: 2px; }
  .item-variant { font-size: 0.78rem; color: #8A9189; margin-bottom: 10px; }
  .item-row { display: flex; align-items: center; justify-content: space-between; }
  .qty-selector { display: flex; align-items: center; border: 1px solid var(--sand-dark); border-radius: 4px; }
  .qty-btn { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 1rem; color: var(--sage); cursor: pointer; background: none; border: none; font-family: 'Inter', sans-serif; }
  .qty-val { width: 26px; text-align: center; font-size: 0.88rem; }
  .item-price { font-weight: 600; color: var(--copper); font-size: 0.92rem; }
  .remove-btn { font-size: 0.75rem; color: #9AA39C; background: none; border: none; text-decoration: underline; margin-top: 4px; font-family: 'Inter', sans-serif; padding: 0; }
  .summary { padding: 20px 24px; background: var(--white); border-top: 1px solid var(--sand-dark); margin-top: 12px; }
  .summary-row { display: flex; justify-content: space-between; font-size: 0.88rem; margin-bottom: 10px; color: #4A5750; }
  .summary-row.total { font-size: 1.05rem; font-weight: 600; color: var(--ink); padding-top: 12px; border-top: 1px solid var(--sand-dark); margin-top: 4px; }
  .checkout-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--white); padding: 16px 24px; border-top: 1px solid var(--sand-dark); }
  .btn-checkout { width: 100%; background: var(--sage); color: var(--white); border: none; padding: 16px; border-radius: 4px; font-size: 0.95rem; font-weight: 500; font-family: 'Inter', sans-serif; cursor: pointer; }
  .btn-checkout:disabled { background: #C4CCC6; }
  .checkout-message { display:none; margin:16px 24px 0; padding:12px 14px; border-radius:8px; background:#fff3df; color:#7a5227; font-size:.84rem; }
  .checkout-message.show { display:block; }
  .checkout-message.error { background:#f9e2df; color:#8f3028; }
</style>
<link rel="stylesheet" href="/premium.css">
</head>
<body>
  <header>
    <a href="/" class="back-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 18l-6-6 6-6"/></svg></a>
    <div class="page-title serif">Mon panier</div>
  </header>
  <div id="emptyState" class="empty-state">
    <div class="empty-icon">🛒</div>
    <div class="empty-text">Votre panier est vide pour le moment</div>
    <a href="/produit.html" class="btn-shop">Continuer mes achats</a>
  </div>
  <div id="cartList" class="cart-list"></div>
  <div id="checkoutMessage" class="checkout-message" role="status"></div>
  <div id="summarySection" class="summary" style="display:none;">
    <div class="summary-row"><span>Sous-total</span><span id="subtotal">0,00 €</span></div>
    <div class="summary-row"><span>Livraison</span><span id="shipping">4,90 €</span></div>
    <div class="summary-row total"><span>Total</span><span id="total">0,00 €</span></div>
  </div>
  <div id="checkoutBar" class="checkout-bar" style="display:none;">
    <button class="btn-checkout" id="checkoutBtn">Passer au paiement</button>
  </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const STORAGE_KEY = 'maison_du_musulman_cart';
  const SHIPPING_FLAT = 4.90;
  const FREE_SHIPPING_THRESHOLD = 40;

  function loadCart() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { try { return JSON.parse(raw); } catch(e) {} }
    return [];
  }
  function saveCart(cart) { localStorage.setItem(STORAGE_KEY, JSON.stringify(cart)); }
  let cart = loadCart();
  let supabaseClient;

  function showCheckoutMessage(text, isError = false) {
    const element = document.getElementById('checkoutMessage');
    element.textContent = text;
    element.className = `checkout-message show${isError ? ' error' : ''}`;
  }

  async function getSupabaseClient() {
    if (supabaseClient) return supabaseClient;
    const response = await fetch('/api/auth-config', { cache: 'no-store' });
    const config = await response.json();
    if (!response.ok || !config.configured || !window.supabase) throw new Error('Configuration du compte indisponible');
    supabaseClient = window.supabase.createClient(config.url, config.anonKey);
    return supabaseClient;
  }

  function render() {
    const list = document.getElementById('cartList');
    const empty = document.getElementById('emptyState');
    const summary = document.getElementById('summarySection');
    const checkoutBar = document.getElementById('checkoutBar');
    if (cart.length === 0) {
      list.innerHTML = ''; empty.classList.add('show');
      summary.style.display = 'none'; checkoutBar.style.display = 'none';
      return;
    }
    empty.classList.remove('show');
    summary.style.display = 'block'; checkoutBar.style.display = 'block';
    list.innerHTML = cart.map((item, i) => `
      <div class="cart-item">
        <div class="item-img">${item.icon}</div>
        <div class="item-info">
          <div class="item-name">${item.name}</div>
          <div class="item-variant">${item.variant}</div>
          <div class="item-row">
            <div class="qty-selector">
              <button class="qty-btn" onclick="changeQty(${i}, -1)">−</button>
              <span class="qty-val">${item.qty}</span>
              <button class="qty-btn" onclick="changeQty(${i}, 1)">+</button>
            </div>
            <span class="item-price">${(item.price * item.qty).toFixed(2).replace('.', ',')} €</span>
          </div>
          <button class="remove-btn" onclick="removeItem(${i})">Retirer</button>
        </div>
      </div>
    `).join('');
    const subtotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
    const shipping = subtotal >= FREE_SHIPPING_THRESHOLD ? 0 : SHIPPING_FLAT;
    const total = subtotal + shipping;
    document.getElementById('subtotal').textContent = subtotal.toFixed(2).replace('.', ',') + ' €';
    document.getElementById('shipping').textContent = shipping === 0 ? 'Offerte' : shipping.toFixed(2).replace('.', ',') + ' €';
    document.getElementById('total').textContent = total.toFixed(2).replace('.', ',') + ' €';
  }
  function changeQty(index, delta) {
    cart[index].qty += delta;
    if (cart[index].qty <= 0) cart.splice(index, 1);
    saveCart(cart); render();
  }
  function removeItem(index) { cart.splice(index, 1); saveCart(cart); render(); }

  document.getElementById('checkoutBtn').addEventListener('click', async () => {
    const btn = document.getElementById('checkoutBtn');
    btn.disabled = true; btn.textContent = 'Redirection...';
    try {
      const client = await getSupabaseClient();
      const sessionResult = await client.auth.getSession();
      const session = sessionResult.data.session;
      if (!session) {
        sessionStorage.setItem('mdm_checkout_return', '/panier.html');
        window.location.href = '/compte.html?commande=connexion';
        return;
      }
      const response = await fetch('/api/create-checkout-session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
        body: JSON.stringify({ cart }),
      });
      const data = await response.json();
      if (data.url) { window.location.href = data.url; return; }
      if (response.status === 401) {
        window.location.href = '/compte.html?commande=connexion';
        return;
      }
      throw new Error(data.error || 'Erreur inconnue');
    } catch (err) {
      showCheckoutMessage(err.message || "Le paiement n'a pas pu démarrer. Réessayez dans un instant.", true);
      btn.disabled = false; btn.textContent = 'Passer au paiement';
    }
  });
  if (new URLSearchParams(location.search).get('paiement') === 'annule') {
    showCheckoutMessage('Paiement annulé : votre panier a été conservé. Vous pouvez réessayer quand vous le souhaitez.');
  }
  render();
</script>
</body>
</html>
