<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commande confirmée — La Maison du Musulman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink: #1C2B24; --sand: #F7F3EC; --sage: #3E5C4E; --white: #FFFFFF; --sand-dark: #EDE6D8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--sand); color: var(--ink); font-family: 'Inter', sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  .icon {
    width: 64px; height: 64px; border-radius: 50%; background: var(--sage);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 24px;
  }
  h1 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 1.6rem; margin-bottom: 12px; }
  p { color: #4A5750; font-size: 0.92rem; max-width: 300px; margin: 0 auto 28px; }
  .btn { display: inline-block; background: var(--sage); color: var(--white); padding: 13px 28px; border-radius: 4px; text-decoration: none; font-size: 0.9rem; }
</style>
<link rel="stylesheet" href="/premium.css">
</head>
<body>
  <div>
    <div class="icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <h1>Commande confirmée</h1>
    <p>Merci pour votre commande ! Un email de confirmation vous a été envoyé. Vous serez notifié dès l'expédition.</p>
    <a href="/" class="btn">Retour à la boutique</a>
  </div>
</body>
</html>
