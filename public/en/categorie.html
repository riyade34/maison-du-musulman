<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Discover the products of L’Univers du Croyant by collection and category.">
<title>Category — L’Univers du Croyant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink: #1C2B24; --sand: #F7F3EC; --copper: #8B6F4E; --sage: #3E5C4E; --white: #FFFFFF; --sand-dark: #EDE6D8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--sand); color: var(--ink); font-family: 'Inter', sans-serif; line-height: 1.5; }
  h1, h2, .serif { font-family: 'Fraunces', serif; font-weight: 500; letter-spacing: -0.01em; }
  a { text-decoration: none; color: inherit; }
  header { display: flex; align-items: center; gap: 14px; padding: 18px 24px; border-bottom: 1px solid var(--sand-dark); position: sticky; top: 0; background: var(--sand); z-index: 10; }
  .back-btn { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
  .header-title { font-size: 1rem; font-weight: 500; }
  .section { padding: 28px 24px 48px; }
  .section-sub { color: #6B7871; font-size: 0.88rem; margin-bottom: 24px; }
  .prod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .prod-card { background: var(--white); border-radius: 4px; border: 1px solid var(--sand-dark); display: block; }
  .prod-img { height: 130px; background: var(--sand-dark); display: flex; align-items: center; justify-content: center; font-size: 1.9rem; }
  .prod-info { padding: 12px; }
  .prod-name { font-size: 0.85rem; margin-bottom: 4px; }
  .prod-price { color: var(--copper); font-weight: 600; font-size: 0.9rem; }
  .sub-card { background: var(--white); border-radius: 4px; border: 1px solid var(--sand-dark); display: block; overflow: hidden; }
  .sub-img { height: 140px; background: var(--sand-dark); display: flex; align-items: center; justify-content: center; font-size: 2.4rem; }
  .sub-label { padding: 14px 12px; font-size: 0.95rem; font-weight: 500; }
  .sub-count { font-size: 0.78rem; color: #8A9189; font-weight: 400; }
  .empty { padding: 40px 0; text-align: center; color: #6B7871; font-size: 0.9rem; }
</style>
<link rel="stylesheet" href="/premium.css">
<link rel="canonical" href="https://luniversducroyant.fr/en/categorie.html">
<meta property="og:site_name" content="L’Univers du Croyant">
<meta property="og:locale" content="en_GB"><meta property="og:locale:alternate" content="fr_FR">
<meta property="og:type" content="website">
<meta property="og:title" content="Category — L’Univers du Croyant">
<meta property="og:description" content="Discover the products of L’Univers du Croyant by collection and category.">
<meta property="og:url" content="https://luniversducroyant.fr/en/categorie.html">
<meta property="og:image" content="https://luniversducroyant.fr/assets/home-lantern.png">
<meta property="og:image:width" content="1942">
<meta property="og:image:height" content="809">
<meta property="og:image:alt" content="Brass lantern glowing in a warm, welcoming setting">
<meta name="twitter:card" content="summary_large_image">
<link rel="alternate" hreflang="fr" href="https://luniversducroyant.fr/categorie.html"><link rel="alternate" hreflang="en" href="https://luniversducroyant.fr/en/categorie.html"><link rel="alternate" hreflang="x-default" href="https://luniversducroyant.fr/categorie.html"><link rel="stylesheet" href="/lang-switch.css"><script src="/i18n-en.js"></script><script src="/i18n.js"></script>
</head>
<body>
  <header>
    <a href="#" id="backLink" class="back-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 18l-6-6 6-6"/></svg></a>
    <h1 class="header-title" id="pageTitle">Category</h1>
  <!--lang-switch--><nav class="mdm-lang" data-lang-switch aria-label="Site language"><a href="/categorie.html" lang="fr" hreflang="fr" aria-label="Français">FR</a><a href="/en/categorie.html" lang="en" hreflang="en" aria-label="English" aria-current="true">EN</a></nav><!--/lang-switch--></header>
  <section class="section">
    <p class="section-sub" id="pageSub"></p>
    <div class="prod-grid" id="prodGrid"></div>
  </section>

  <script src="/catalog.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const cat = params.get('cat');
    const sub = params.get('sub');
    const I18N = window.MDM_I18N;
    const catItems = window.PRODUCTS.filter(p => p.category === cat).map(p => I18N.product(p));

    const grid = document.getElementById('prodGrid');
    const backLink = document.getElementById('backLink');

    function fmtPrice(p) {
      const v = p.variants.find(x => x.variant === p.defaultVariant) || p.variants[0];
      return I18N.money(v.price);
    }

    function renderProductGrid(items) {
      if (items.length === 0) {
        grid.innerHTML = '';
        grid.outerHTML = '<div class="empty">' + I18N.t('cat.empty', 'Aucun produit ici pour le moment.') + '</div>';
        return;
      }
      grid.innerHTML = items.map(p => `
        <a href="${I18N.path('/produit.html')}?id=${p.id}" class="prod-card">
          <div class="prod-img">${p.icon}</div>
          <div class="prod-info">
            <div class="prod-name">${p.name}</div>
            <div class="prod-price">${fmtPrice(p)}</div>
          </div>
        </a>`).join('');
    }

    function renderSubTiles(subGroups) {
      grid.innerHTML = subGroups.map(g => `
        <a href="${I18N.path('/categorie.html')}?cat=${cat}&sub=${g.key}" class="sub-card">
          <div class="sub-img">${g.icon}</div>
          <div class="sub-label">${g.label}<br><span class="sub-count">${I18N.tp('cat.count', '{n} produit', '{n} produits', g.count)}</span></div>
        </a>`).join('');
    }

    if (sub) {
      const items = catItems.filter(p => p.subCategory === sub);
      const label = items.length ? items[0].subCategoryLabel : I18N.t('cat.products', 'Produits');
      document.title = label + ' — L’Univers du Croyant';
      document.getElementById('pageTitle').textContent = label;
      document.getElementById('pageSub').textContent = I18N.tp('cat.count', '{n} produit', '{n} produits', items.length);
      backLink.href = I18N.path('/categorie.html') + '?cat=' + cat;
      renderProductGrid(items);
    } else {
      const hasSub = catItems.some(p => p.subCategory);
      const label = catItems.length ? catItems[0].categoryLabel : I18N.t('cat.category', 'Catégorie');
      document.title = label + ' — L’Univers du Croyant';
      document.getElementById('pageTitle').textContent = label;
      backLink.href = I18N.path('/');

      if (hasSub) {
        const groups = {};
        catItems.forEach(p => {
          if (!p.subCategory) return;
          if (!groups[p.subCategory]) {
            groups[p.subCategory] = { key: p.subCategory, label: p.subCategoryLabel, icon: p.icon, count: 0 };
          }
          groups[p.subCategory].count++;
        });
        const subGroups = Object.values(groups);
        document.getElementById('pageSub').textContent = I18N.tp('cat.subcount', '{n} sous-catégorie', '{n} sous-catégories', subGroups.length);
        renderSubTiles(subGroups);
      } else {
        document.getElementById('pageSub').textContent = I18N.tp('cat.count', '{n} produit', '{n} produits', catItems.length);
        renderProductGrid(catItems);
      }
    }

    (function setCanonical() {
      let pagePath = '/categorie.html';
      if (catItems.length) {
        pagePath += '?cat=' + encodeURIComponent(cat);
        if (sub && catItems.some(p => p.subCategory === sub)) pagePath += '&sub=' + encodeURIComponent(sub);
      }
      const canonicalUrl = I18N.absolute(pagePath);
      I18N.setAlternates(pagePath);
      document.querySelector('link[rel="canonical"]').href = canonicalUrl;
      [['og:title', document.title], ['og:url', canonicalUrl]].forEach(([name, value]) => {
        const tag = document.querySelector('meta[property="' + name + '"]');
        if (tag) tag.setAttribute('content', value);
      });
    })();
  </script>
</body>
</html>
